services:
  app:
    build:
      context: .
      target: dev
    command: bun run dev --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped

  app-preview:
    profiles:
      - preview
    build:
      context: .
      target: preview
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    restart: unless-stopped
